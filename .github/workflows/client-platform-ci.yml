name: client-platform-ci

on:
  push:
    branches:
      - "feat/client-platform-refactor"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "go.work"
      - ".github/workflows/client-platform-ci.yml"

concurrency:
  group: client-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web
        run: pnpm build:web

      - name: Build Desktop UI
        run: pnpm build:desktop-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run client interaction smoke tests
        run: pnpm test:e2e

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Validate Desktop Go
        working-directory: apps/desktop
        run: go test ./...
